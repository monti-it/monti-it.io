# Azure DevOps Pipeline for Vite + React
# Builds app, publishes dist as artifact, and optionally builds/pushes Docker image

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  # Node and caching
  NODE_VERSION: '20.x'
  # Toggle Docker build/push
  DOCKER_BUILD: 'true'
  DOCKER_PUSH: 'true' # set to 'true' to push
  # Container image metadata (set according to your registry)
  IMAGE_NAME: 'try-react-dev'
  IMAGE_TAG: '$(Build.BuildId)'
  # For ACR push (configure service connection)
  ACR_LOGIN_SERVER: 'index.docker.io'
  ACR_REPOSITORY: 'ptitlu69/try-react-dev'

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: build
        displayName: Build job
        steps:
          - task: NodeTool@0
            displayName: Use Node $(NODE_VERSION)
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: |
              echo "Restoring with npm ci"
              npm ci --no-audit --no-fund
            displayName: Install dependencies

          - script: |
              npm run lint --if-present
            displayName: Lint

          - script: |
              npm run build
            displayName: Build

          - task: PublishBuildArtifacts@1
            displayName: Publish dist artifact
            inputs:
              PathtoPublish: 'dist'
              ArtifactName: 'dist'
              publishLocation: 'Container'

          - script: |
              echo "Docker build toggle: $(DOCKER_BUILD)"
              if [ "$(DOCKER_BUILD)" = "true" ]; then \
                docker build -t $(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):$(IMAGE_TAG) . ; \
              else \
                echo "Skipping docker build" ; \
              fi
            displayName: Docker build

  - stage: PushContainer
    displayName: Build and Push Container
    condition: 'false' # and(succeeded(), eq(variables.DOCKER_BUILD, 'true'))
    dependsOn: Build
    jobs:
      - job: push
        displayName: Push image to registry
        condition: and(succeeded(), eq(variables.DOCKER_PUSH, 'true'))
        steps:
          - script: |
              echo "Logging into ACR $(ACR_LOGIN_SERVER)"
              echo "Ensure a Docker registry service connection is configured"
            displayName: Preflight

          # Use a Docker task with service connection named 'dockerRegistryServiceConnection'
          - task: Docker@2
            displayName: Login to registry
            inputs:
              containerRegistry: 'my docker repo test'
              command: 'login'

          - task: Docker@2
            displayName: Push image
            inputs:
              containerRegistry: 'my docker repo test'
              repository: '$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY)'
              command: 'push'
              tags: '$(IMAGE_TAG)'

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: Deploy2OVH
        displayName: 'Copy files to OVH server'
        condition: eq(variables['Build.Reason'], 'IndividualCI')
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact'
            inputs:
              artifactName: 'dist'
              targetPath: '$(Pipeline.Workspace)/dist'

          - template: copy-files-to-ovh.yaml
            parameters:
              sourceFolder: '$(Pipeline.Workspace)/dist'
              targetFolder: 'www/monti-it.io'
