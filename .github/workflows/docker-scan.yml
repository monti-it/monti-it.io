name: Docker image scan

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/docker-scan.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/docker-scan.yml
  schedule:
    - cron: '0 6 * * 1' # weekly, catches new CVEs published against the already-built image
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Build and scan
    uses: monti-it/.github/.github/workflows/container-scan.yml@v1
    with:
      target: prod
