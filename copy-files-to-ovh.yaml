parameters:
- name: sourceFolder
  type: string
- name: targetFolder
  type: string

steps:
        
- task: CopyFilesOverSSH@0
  displayName: Upload ${{ parameters.sourceFolder }} to OVH server
  inputs:
    sshEndpoint: 'OVH SFTP @ monti-it.io'
    sourceFolder: ${{ parameters.sourceFolder }}
    contents: '**'
    targetFolder: ${{ parameters.targetFolder }}
    cleanTargetFolder: false
    readyTimeout: '20000'
