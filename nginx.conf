server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback: serve real files as-is, route everything else to index.html
    # so React Router can handle deep links (/reseau, /en/domotique...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The résumé PDF used to be French-only at /resume.pdf: keep old links
    # working, like the OVH host's public/.htaccess. Relative Location, so the
    # redirect keeps whatever host/port the container is published on.
    location = /resume.pdf {
        absolute_redirect off;
        return 301 /resume-fr.pdf;
    }

    # public/.htaccess is only meant for the OVH Apache host
    location ~ /\.ht {
        deny all;
    }
}
